<!doctype html>
<html>
<head>
<meta charset="utf-8">
<!--
  showhow:collage — two to four real panels of the app (lifts), each landing as its topic is spoken.
  For "what you learn here": the panels are the proof, the labels and narration carry the meaning.

  data:
    kicker, title, highlight:   optional heading
    items:   [{ lift, label, cue }]   lift = a name from the recording, or a lifts/x.html file
    retint:  [fromHue, toHue]  saturated colours in that range take the video's accent (e.g. [230, 300] for purple)
  Panels keep their order and are split into rows whichever way shows them biggest, scaled to fill the
  room under the heading. Landscape fans them slightly; vertical keeps them straight.
-->
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 100vw; height: 100vh; overflow: hidden; background: transparent; color: #fff; font-family: var(--font); -webkit-font-smoothing: antialiased; }
  #head { position: absolute; left: 150px; top: 96px; right: 150px; }
  .kicker { display: inline-flex; align-items: center; gap: 12px; padding: 9px 18px; border-radius: 999px; font-size: 22px; font-weight: 600; letter-spacing: .1em; text-transform: uppercase;
    background: color-mix(in srgb, var(--accent) 22%, transparent); box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--accent) 55%, transparent); }
  h1 { margin-top: 22px; font-size: 72px; line-height: 1.05; letter-spacing: -.04em; font-weight: 760; }
  h1 .hl { background: linear-gradient(100deg, #fff 10%, color-mix(in srgb, var(--accent) 55%, #fff) 60%, var(--accent)); -webkit-background-clip: text; background-clip: text; color: transparent; }
  #board { position: absolute; inset: 0; transform-origin: 50% 50%; }
  .item { position: absolute; }
  .item .label { position: absolute; left: 0; top: -58px; display: inline-flex; align-items: center; gap: 10px; padding: 9px 18px; border-radius: 12px;
    font-size: 26px; font-weight: 700; letter-spacing: -.01em; white-space: nowrap; background: var(--accent); color: #fff; box-shadow: 0 12px 30px rgba(0,0,0,.3); }
  .item .card { border-radius: 18px; overflow: hidden; box-shadow: 0 40px 90px rgba(0,0,0,.5), 0 0 0 1px rgba(255,255,255,.1); }
  .item .card > [data-lift] { transform-origin: 0 0; }
  @media (max-aspect-ratio: 1/1) {
    #head { left: 80px; right: 80px; top: 150px; }
    h1 { font-size: 76px; }
  }
</style>
</head>
<body>
<div id="head"></div>
<div id="board"></div>
<script>
  const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  window.showhowTimeline = async ({ data, at, gsap, kit, duration }) => {
    const W = innerWidth, H = innerHeight, vertical = H > W;
    const hl = new Set((data.highlight || '').toLowerCase().split(/\s+/).filter(Boolean));
    const head = document.getElementById('head');
    head.innerHTML = `${data.kicker ? `<div class="kicker">${esc(data.kicker)}</div>` : ''}
      ${data.title ? `<h1>${data.title.split(/(\s+)/).map((w) => hl.has(w.toLowerCase().replace(/[^\p{L}\p{N}]/gu, '')) ? `<span class="hl">${esc(w)}</span>` : esc(w)).join('')}</h1>` : ''}`;
    const board = document.getElementById('board');
    const items = data.items.map((it) => {
      const el = document.createElement('div');
      el.className = 'item';
      el.innerHTML = `<div class="label">${esc(it.label)}</div><div class="card"></div>`;
      const lift = kit.lift(it.lift);
      el.querySelector('.card').appendChild(lift);
      board.appendChild(el);
      return { el, lift, w: parseFloat(lift.style.width), h: parseFloat(lift.style.height) };
    });
    await kit.ready();

    if (data.retint) for (const it of items) kit.retint(it.lift, data.retint);

    const top = head.getBoundingClientRect().bottom + 100, bottom = vertical ? H - 440 : H - 220;
    const side = vertical ? 80 : 150, gap = 44, labelRoom = 70, availW = W - side * 2;
    // Every way to split the panels, in order, into rows; keep the one that shows them biggest.
    const splits = [];
    for (let mask = 0; mask < 1 << (items.length - 1); mask++) {
      const rows = [{ items: [items[0]] }];
      items.slice(1).forEach((it, i) => (mask >> i & 1 ? rows.push({ items: [it] }) : rows.at(-1).items.push(it)));
      splits.push(rows);
    }
    const fit = (rows) => {
      for (const r of rows) r.h = (availW - gap * (r.items.length - 1)) / r.items.reduce((a, it) => a + it.w / it.h, 0);
      const room = bottom - top - (labelRoom + gap) * rows.length + gap;
      const f = Math.min(1, room / rows.reduce((a, r) => a + r.h, 0));
      return { rows, room, f, size: Math.min(...rows.map((r) => r.h * f)) };
    };
    const best = splits.map(fit).sort((a, b) => b.size - a.size)[0];
    const { rows, room, f } = best;
    let y = top + Math.max(0, (room - rows.reduce((a, r) => a + r.h * f, 0)) / 2);
    for (const r of rows) {
      const h = r.h * f;
      const rowW = r.items.reduce((a, it) => a + it.w * (h / it.h), 0) + gap * (r.items.length - 1);
      let x = (W - rowW) / 2;
      y += labelRoom;
      for (const it of r.items) {
        it.k = h / it.h;
        Object.assign(it.el.style, { left: `${x}px`, top: `${y}px` });
        x += it.w * it.k + gap;
      }
      y += h + gap;
    }
    for (const it of items) {
      it.lift.style.transform = `scale(${it.k})`;
      // The lift's own transform-origin (inlined from the app) would scale it off its card.
      it.lift.style.transformOrigin = '0 0';
      Object.assign(it.el.querySelector('.card').style, { width: `${it.w * it.k}px`, height: `${it.h * it.k}px` });
    }

    const tl = gsap.timeline();
    tl.fromTo(board, { scale: 1 }, { scale: 1.035, duration, ease: 'none' }, 0);
    if (data.kicker) tl.from('.kicker', { y: 14, opacity: 0, duration: 0.6, ease: 'expo.out' }, 0.05);
    if (data.title) tl.from('h1', { y: 26, opacity: 0, filter: 'blur(12px)', duration: 0.9, ease: 'expo.out' }, 0.15);
    const tilt = [-2.2, 1.6, -1.2, 2];
    let last = 0.5;
    items.forEach((it, i) => {
      const cue = data.items[i].cue;
      const t = cue ? Math.max(last + 0.25, at(cue, last + 0.9) - 0.25) : last + (i ? 0.9 : 0.4);
      tl.from(it.el, { y: 120, rotate: tilt[i % 4] * 3, opacity: 0, filter: 'blur(8px)', duration: 0.9, ease: 'expo.out' }, t);
      tl.to(it.el, { rotate: vertical ? 0 : tilt[i % 4], duration: 0.9, ease: 'expo.out' }, t);
      tl.from(it.el.querySelector('.label'), { y: 14, opacity: 0, duration: 0.5, ease: 'back.out(2)' }, t + 0.25);
      kit.sfx(t, 'slide', 0.22);
      last = t;
    });
    return tl;
  };
</script>
</body>
</html>
