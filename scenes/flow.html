<!doctype html>
<html>
<head>
<meta charset="utf-8">
<!--
  showhow:flow — a diagram that draws itself: how the pieces connect.

  data:
    kicker, title, highlight:   optional heading
    nodes:   [{ id, label, sub?, col, row?, kind?: "input" | "core" | "output", cue? }]
             columns go left to right; rows stack within a column (default: order)
    edges:   [{ from, to, label?, cue? }]   drawn once both ends are on screen
    groups:  [{ label, nodes: [ids] }]      a dashed frame around related nodes
    pulses:  true (default) — dots travel the edges once they are drawn, so the flow reads as live
  Each node lands when the narration says its `cue` (else column by column).
-->
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 100vw; height: 100vh; overflow: hidden; background: transparent; color: var(--text, #fff); font-family: var(--font); -webkit-font-smoothing: antialiased; }
  #head { position: absolute; left: 150px; top: 96px; right: 150px; }
  .kicker { display: inline-flex; align-items: center; gap: 12px; padding: 9px 18px; border-radius: 999px; font-size: 22px; font-weight: 600; letter-spacing: .1em; text-transform: uppercase;
    background: color-mix(in srgb, var(--accent) 22%, transparent); box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--accent) 55%, transparent); }
  h1 { font-family: var(--heading, var(--font)); margin-top: 22px; font-size: 64px; line-height: 1.05; letter-spacing: -.035em; font-weight: 750; }
  h1 .hl { background: linear-gradient(100deg, var(--text, #fff) 10%, color-mix(in srgb, var(--accent) 55%, var(--text, #fff)) 60%, var(--accent)); -webkit-background-clip: text; background-clip: text; color: transparent; }
  #world { position: absolute; inset: 0; transform-origin: 50% 60%; }
  svg { position: absolute; inset: 0; width: 1920px; height: 1080px; overflow: visible; }
  .edge { fill: none; stroke: color-mix(in srgb, var(--accent) 70%, var(--text, #fff)); stroke-width: 3; stroke-linecap: round; }
  .group { fill: color-mix(in srgb, var(--accent) 6%, transparent); stroke: color-mix(in srgb, var(--accent) 50%, transparent); stroke-width: 2; stroke-dasharray: 8 8; }
  .pulse { fill: var(--bg, #fff); stroke: var(--accent); stroke-width: 2; filter: drop-shadow(0 0 8px var(--accent)); }
  .glabel { position: absolute; font-size: 20px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: color-mix(in srgb, var(--accent) 45%, var(--text, #fff)); }
  .elabel { position: absolute; transform: translate(-50%, -50%); padding: 6px 12px; border-radius: 8px; font-size: 19px; font-weight: 600; white-space: nowrap;
    background: var(--bg, #12141c); box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--accent) 45%, transparent); color: color-mix(in srgb, var(--text, #fff) 90%, transparent); }
  .node { position: absolute; padding: 20px 24px; border-radius: 18px; background: color-mix(in srgb, var(--text, #fff) 7%, transparent); backdrop-filter: blur(10px);
    box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--text, #fff) 14%, transparent), 0 20px 50px rgba(0,0,0,.35); }
  .node b { display: block; font-size: 29px; font-weight: 700; letter-spacing: -.015em; line-height: 1.15; }
  .node span { display: block; margin-top: 6px; font-size: 21px; line-height: 1.3; color: color-mix(in srgb, var(--text, #fff) 70%, transparent); }
  .node.core { background: linear-gradient(140deg, var(--accent), color-mix(in srgb, var(--accent) 55%, #000)); box-shadow: 0 0 0 1px color-mix(in srgb, var(--text, #fff) 25%, transparent), 0 24px 70px color-mix(in srgb, var(--accent) 45%, transparent); }
  .node.core b { color: var(--on-accent, #fff); }
  .node.core span { color: color-mix(in srgb, var(--on-accent, #fff) 85%, transparent); }
  .node.output { box-shadow: inset 0 0 0 2px color-mix(in srgb, var(--accent) 70%, transparent), 0 20px 50px rgba(0,0,0,.35); }
  @media (max-aspect-ratio: 1/1) { #head { left: 80px; right: 80px; top: 180px; } .node b { font-size: 30px; } }
</style>
</head>
<body>
<div id="head"></div>
<div id="world"><svg id="lines"></svg></div>
<script>
  const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  const NS = 'http://www.w3.org/2000/svg';

  window.showhowTimeline = ({ data, at, gsap, kit, duration }) => {
    const head = document.getElementById('head');
    const hl = new Set((data.highlight || '').toLowerCase().split(/\s+/).filter(Boolean));
    head.innerHTML = `${data.kicker ? `<div class="kicker">${esc(data.kicker)}</div>` : ''}
      ${data.title ? `<h1>${data.title.split(/(\s+)/).map((w) => hl.has(w.toLowerCase().replace(/[^\p{L}\p{N}]/gu, '')) ? `<span class="hl">${esc(w)}</span>` : esc(w)).join('')}</h1>` : ''}`;
    // Vertical: the same diagram, transposed: columns become rows, read top to bottom.
    const VERT = innerHeight > innerWidth;
    const top = data.title || data.kicker ? head.getBoundingClientRect().bottom + 70 : 150;
    const area = VERT ? { x: 80, y: top, w: 920, h: 1480 - top } : { x: 150, y: top, w: 1620, h: 860 - top };
    const world = document.getElementById('world');
    const svg = document.getElementById('lines');

    // Layout: columns spread across the width, rows centred in each column.
    const nodes = data.nodes;
    const cols = Math.max(...nodes.map((n) => n.col)) + 1;
    const colW = area.w / cols;
    const rowH = area.h / cols;
    const most = Math.max(...Array.from({ length: cols }, (_, c) => nodes.filter((n) => n.col === c).length));
    const nodeW = VERT ? Math.min(420, (area.w - 30 * (most - 1)) / most) : Math.min(380, colW - 90);
    const byCol = Array.from({ length: cols }, (_, c) => nodes.filter((n) => n.col === c).sort((a, b) => (a.row ?? 0) - (b.row ?? 0)));
    const el = {};
    for (const n of nodes) {
      const d = document.createElement('div');
      d.className = `node ${n.kind || ''}`;
      d.style.width = `${nodeW}px`;
      d.innerHTML = `<b>${esc(n.label)}</b>${n.sub ? `<span>${esc(n.sub)}</span>` : ''}`;
      world.appendChild(d);
      el[n.id] = d;
    }
    const box = {};
    if (VERT) byCol.forEach((list, c) => {
      const gap = 30;
      const total = list.length * nodeW + gap * (list.length - 1);
      let x = area.x + (area.w - total) / 2;
      for (const n of list) {
        const d = el[n.id];
        const y = area.y + c * rowH + (rowH - d.offsetHeight) / 2;
        Object.assign(d.style, { left: `${x}px`, top: `${y}px` });
        box[n.id] = { x, y, w: nodeW, h: d.offsetHeight };
        x += nodeW + gap;
      }
    });
    else byCol.forEach((list, c) => {
      const gap = 34;
      const total = list.reduce((s, n) => s + el[n.id].offsetHeight, 0) + gap * (list.length - 1);
      let y = area.y + (area.h - total) / 2;
      for (const n of list) {
        const d = el[n.id];
        const x = area.x + c * colW + (colW - nodeW) / 2;
        Object.assign(d.style, { left: `${x}px`, top: `${y}px` });
        box[n.id] = { x, y, w: nodeW, h: d.offsetHeight };
        y += d.offsetHeight + gap;
      }
    });

    const tl = gsap.timeline();
    if (data.kicker) tl.from('#head .kicker', { y: 16, opacity: 0, duration: 0.6, ease: 'expo.out' }, 0.05);
    if (data.title) tl.from('#head h1', { y: 28, opacity: 0, filter: 'blur(12px)', duration: 0.9, ease: 'expo.out' }, 0.15);
    // One continuous, linear push for the whole scene: no frozen hold.
    tl.fromTo(world, { scale: 1 }, { scale: 1.04, duration, ease: 'none' }, 0);

    // When each node lands.
    const when = {};
    // Column by column: an uncued node never lands before the column to its left.
    let prev = 0.4;
    byCol.forEach((list, c) => {
      const base = Math.max(0.9 + c * 1.1, prev + 0.6);
      list.forEach((n, i) => { when[n.id] = n.cue ? Math.max(0.7, at(n.cue, base) - 0.15) : base + i * 0.12; });
      prev = Math.max(...list.map((n) => when[n.id]));
    });

    for (const g of data.groups || []) {
      const bs = g.nodes.map((id) => box[id]);
      const x = Math.min(...bs.map((b) => b.x)) - 22, y = Math.min(...bs.map((b) => b.y)) - 56;
      const w = Math.max(...bs.map((b) => b.x + b.w)) + 22 - x, h = Math.max(...bs.map((b) => b.y + b.h)) + 22 - y;
      const r = document.createElementNS(NS, 'rect');
      Object.entries({ x, y, width: w, height: h, rx: 24, class: 'group' }).forEach(([k, v]) => r.setAttribute(k, v));
      svg.prepend(r);
      const lab = document.createElement('div');
      lab.className = 'glabel';
      lab.textContent = g.label;
      Object.assign(lab.style, { left: `${x + 22}px`, top: `${y + 16}px` });
      world.appendChild(lab);
      const t = Math.min(...g.nodes.map((id) => when[id])) - 0.3;
      tl.from(r, { drawSVG: '0%', duration: 0.9, ease: 'power2.inOut' }, t);
      tl.from(lab, { opacity: 0, x: -10, duration: 0.5, ease: 'expo.out' }, t + 0.2);
    }

    nodes.forEach((n) => {
      tl.from(el[n.id], { opacity: 0, y: 24, scale: 0.94, duration: 0.6, ease: 'back.out(1.6)' }, when[n.id]);
      kit.sfx(when[n.id], n.kind === 'core' ? 'reveal' : 'pop', n.kind === 'core' ? 0.3 : 0.2);
    });

    // Edges: right side to left side between columns, bottom to top within one.
    for (const e of data.edges || []) {
      const a = box[e.from], b = box[e.to];
      if (!a || !b) throw new Error(`showhow:flow: edge ${e.from} → ${e.to} names a node that does not exist`);
      let d, mid;
      if (!VERT && b.x > a.x + 10) {
        const x1 = a.x + a.w, y1 = a.y + a.h / 2, x2 = b.x - 14, y2 = b.y + b.h / 2, dx = (x2 - x1) / 2;
        d = `M${x1},${y1} C${x1 + dx},${y1} ${x2 - dx},${y2} ${x2},${y2}`;
        mid = { x: (x1 + x2) / 2, y: (y1 + y2) / 2 };
      } else {
        const x1 = a.x + a.w / 2, y1 = a.y + a.h, x2 = b.x + b.w / 2, y2 = b.y - 14;
        d = `M${x1},${y1} C${x1},${(y1 + y2) / 2} ${x2},${(y1 + y2) / 2} ${x2},${y2}`;
        mid = { x: (x1 + x2) / 2, y: (y1 + y2) / 2 };
      }
      const path = document.createElementNS(NS, 'path');
      path.setAttribute('d', d);
      path.setAttribute('class', 'edge');
      svg.appendChild(path);
      // Arrowhead: a short chevron at the end, drawn with the line.
      const end = path.getPointAtLength(path.getTotalLength()), pre = path.getPointAtLength(path.getTotalLength() - 12);
      const ang = Math.atan2(end.y - pre.y, end.x - pre.x);
      const head = document.createElementNS(NS, 'path');
      const p = (da) => `${end.x + 14 * Math.cos(ang + Math.PI + da)},${end.y + 14 * Math.sin(ang + Math.PI + da)}`;
      head.setAttribute('d', `M${p(0.55)} L${end.x},${end.y} L${p(-0.55)}`);
      head.setAttribute('class', 'edge');
      svg.appendChild(head);
      const t = e.cue ? at(e.cue, 0) - 0.1 : Math.max(when[e.from], when[e.to]) + 0.35;
      tl.from(path, { drawSVG: '0%', duration: 0.7, ease: 'power2.inOut' }, t);
      tl.from(head, { opacity: 0, duration: 0.2 }, t + 0.6);
      if (e.label) {
        const lab = document.createElement('div');
        lab.className = 'elabel';
        lab.textContent = e.label;
        Object.assign(lab.style, { left: `${mid.x}px`, top: `${mid.y}px` });
        world.appendChild(lab);
        tl.from(lab, { opacity: 0, scale: 0.9, duration: 0.4, ease: 'back.out(2)' }, t + 0.4);
      }
      if (data.pulses !== false) {
        const dot = document.createElementNS(NS, 'circle');
        dot.setAttribute('r', 6);
        dot.setAttribute('class', 'pulse');
        svg.appendChild(dot);
        const start = t + 0.8, lap = 1.6, laps = Math.max(1, Math.floor((duration - start) / (lap + 0.4)));
        tl.set(dot, { opacity: 0 }, 0);
        tl.set(dot, { opacity: 1 }, start);
        tl.to(dot, { motionPath: { path, align: path, alignOrigin: [0.5, 0.5] }, duration: lap, ease: 'power1.inOut', repeat: laps - 1, repeatDelay: 0.4 }, start);
      }
    }
    return tl;
  };
</script>
</body>
</html>
