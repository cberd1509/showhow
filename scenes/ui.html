<!doctype html>
<html>
<head>
<meta charset="utf-8">
<!--
  showhow:ui — a real piece of the app (a `lift`), brought to life.

  data:
    lift:      name given to `{ lift: …, as: name }` in a recorded step
    kicker, title, highlight:   optional heading above it
    items:     CSS selector inside the lift for parts that arrive one by one (rows, cards)
    cues:      one narration word per item, so each lands as it is said (else a stagger)
    draw:      CSS selector of SVG strokes to draw in as their item lands (check marks, icons)
    marks:     [{ text, cue, label? }] spotlight the part containing `text` when `cue` is said
    sound:     per item (default "pop"); `markSound` per mark (default "select")
    width:     the lift's width on screen in px (default: fit 1500×660)
  The lift enters tilted and settles flat; the rest of the scene breathes slowly.
-->
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 100vw; height: 100vh; overflow: hidden; background: transparent; color: #fff; font-family: var(--font); -webkit-font-smoothing: antialiased; }
  #head { position: absolute; left: 150px; top: 96px; right: 150px; }
  .kicker { display: inline-flex; align-items: center; gap: 12px; padding: 9px 18px; border-radius: 999px; font-size: 22px; font-weight: 600; letter-spacing: .1em; text-transform: uppercase;
    background: color-mix(in srgb, var(--accent) 22%, transparent); box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--accent) 55%, transparent); }
  h1 { margin-top: 22px; font-size: 64px; line-height: 1.05; letter-spacing: -.035em; font-weight: 750; }
  h1 .hl { background: linear-gradient(100deg, #fff 10%, color-mix(in srgb, var(--accent) 55%, #fff) 60%, var(--accent)); -webkit-background-clip: text; background-clip: text; color: transparent; }
  #stagewrap { position: absolute; left: 0; right: 0; display: flex; justify-content: center; perspective: 1800px; }
  #ui { position: relative; transform-origin: 50% 0%; border-radius: 18px;
    box-shadow: 0 50px 120px rgba(0,0,0,.5), 0 0 0 1px rgba(255,255,255,.08), 0 0 140px color-mix(in srgb, var(--accent) 28%, transparent); }
  #ui > [data-lift] { transform-origin: 0 0; }
  #dim { position: absolute; inset: 0; pointer-events: none; }
  .spot { position: absolute; border-radius: 14px; box-shadow: 0 0 0 3px var(--accent), 0 0 0 10px color-mix(in srgb, var(--accent) 28%, transparent), 0 0 0 9999px rgba(8,10,14,.45); opacity: 0; }
  .tag { position: absolute; padding: 9px 16px; border-radius: 10px; font-size: 24px; font-weight: 600; white-space: nowrap; background: var(--accent); color: #fff; opacity: 0; }
  @media (max-aspect-ratio: 1/1) { #head { left: 80px; right: 80px; top: 180px; } }
</style>
</head>
<body>
<div id="head"></div>
<div id="stagewrap"><div id="ui"></div></div>
<script>
  const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  const VERT = innerHeight > innerWidth;
  const BOX = VERT ? { w: 920, h: 1150 } : { w: 1500, h: 660 };
  const FLOOR = VERT ? 1480 : 880;

  window.showhowTimeline = async ({ data, at, gsap, kit, duration }) => {
    const hasHead = data.title || data.kicker;
    const hl = new Set((data.highlight || '').toLowerCase().split(/\s+/).filter(Boolean));
    document.getElementById('head').innerHTML = hasHead ? `${data.kicker ? `<div class="kicker">${esc(data.kicker)}</div>` : ''}
      ${data.title ? `<h1>${data.title.split(/(\s+)/).map((w) => hl.has(w.toLowerCase().replace(/[^\p{L}\p{N}]/gu, '')) ? `<span class="hl">${esc(w)}</span>` : esc(w)).join('')}</h1>` : ''}` : '';

    // The lift, scaled to fit what is left of the frame.
    const lift = kit.lift(data.lift);
    const ui = document.getElementById('ui');
    ui.appendChild(lift);
    const w0 = parseFloat(lift.style.width), h0 = parseFloat(lift.style.height);
    const top = hasHead ? document.getElementById('head').getBoundingClientRect().bottom + 50 : VERT ? 220 : 140;
    // Spotlight labels go under the panel: leave them a strip.
    const room = { w: BOX.w, h: Math.min(BOX.h, FLOOR - top - (data.marks?.some((m) => m.label) ? 84 : 0)) };
    const k = data.width ? data.width / w0 : Math.min(room.w / w0, room.h / h0, 2.2);
    lift.style.transform = `scale(${k})`;
    lift.style.transformOrigin = '0 0';
    Object.assign(ui.style, { width: `${w0 * k}px`, height: `${h0 * k}px`, borderRadius: getComputedStyle(lift).borderRadius });
    const wrap = document.getElementById('stagewrap');
    wrap.style.top = `${top + Math.max(0, (room.h - h0 * k) / 2)}px`;

    // Measure on the settled layout: fonts in, and before any from() tween poses the panel tilted.
    await kit.ready();
    const u = ui.getBoundingClientRect();
    const marks = (data.marks || []).map((m) => {
      // The smallest block containing the text, widened to its item when it is inside one.
      const hit = [...lift.querySelectorAll('*')].reverse().find((e) => e.textContent.trim().includes(m.text) && e.getBoundingClientRect().width > 40);
      const el = (data.items && hit?.closest(data.items)) || hit || null;
      if (!el) throw new Error(`showhow:ui: no part of "${data.lift}" contains "${m.text}"`);
      return { m, r: el.getBoundingClientRect() };
    });

    const tl = gsap.timeline({ defaults: { ease: 'expo.out' } });
    if (hasHead) {
      tl.from('#head .kicker', { y: 16, opacity: 0, duration: 0.6 }, 0.05);
      tl.from('#head h1', { y: 28, opacity: 0, filter: 'blur(12px)', duration: 0.9 }, 0.15);
    }
    tl.from(ui, { rotateX: 24, y: 120, scale: 0.92, opacity: 0, filter: 'blur(10px)', duration: 1.4 }, 0.25);
    kit.sfx(0.3, 'slide', 0.25);
    // A slow drift after it lands keeps a long hold alive.
    tl.to(ui, { scale: 1.03, y: -6, duration: Math.max(1, duration - 1.6), ease: 'none' }, 1.6);

    const items = data.items ? [...lift.querySelectorAll(data.items)] : [];
    const draws = data.draw ? [...lift.querySelectorAll(data.draw)] : [];
    items.forEach((item, i) => {
      const t = data.cues?.[i] ? Math.max(0.9, at(data.cues[i], 1.2 + i * 0.45) - 0.15) : 1.2 + i * 0.45;
      tl.from(item, { y: 18, opacity: 0, scale: 0.97, duration: 0.6, ease: 'back.out(1.6)' }, t);
      for (const d of draws.filter((d) => item.contains(d))) tl.from(d, { drawSVG: '0%', duration: 0.5, ease: 'power2.out' }, t + 0.25);
      kit.sfx(t, data.sound ?? 'pop', 0.22);
    });

    // Spotlights: ring the part, dim the rest, with a label.
    for (const { m, r } of marks) {
      const spot = document.createElement('div');
      spot.className = 'spot';
      Object.assign(spot.style, { left: `${r.left - u.left - 8}px`, top: `${r.top - u.top - 8}px`, width: `${r.width + 16}px`, height: `${r.height + 16}px` });
      ui.appendChild(spot);
      const t = m.cue ? at(m.cue, 3) - 0.1 : 3;
      tl.to(spot, { opacity: 1, duration: 0.45, ease: 'power2.out' }, t);
      kit.sfx(t, data.markSound ?? 'select', 0.25);
      if (m.label) {
        const tag = document.createElement('div');
        tag.className = 'tag';
        tag.textContent = m.label;
        ui.appendChild(tag);
        // Beside the part if there is room in the frame, else under the whole panel, else above it: never on top of the app's own text.
        const tw = tag.offsetWidth, th = tag.offsetHeight;
        if (r.right + 28 + tw < innerWidth - 80) Object.assign(tag.style, { left: `${r.right - u.left + 28}px`, top: `${r.top - u.top + (r.height - th) / 2}px` });
        else if (u.bottom + 24 + th < FLOOR) Object.assign(tag.style, { left: `${r.left - u.left}px`, top: `${u.height + 24}px` });
        else Object.assign(tag.style, { left: `${r.left - u.left}px`, top: `${-th - 24}px` });
        tl.fromTo(tag, { opacity: 0, y: -8 }, { opacity: 1, y: 0, duration: 0.45, ease: 'back.out(2)' }, t + 0.15);
      }
      if (m.until) tl.to([spot, ...ui.querySelectorAll('.tag')].slice(-2), { opacity: 0, duration: 0.4 }, at(m.until, t + 2.5));
    }
    return tl;
  };
</script>
</body>
</html>
