title: Find the Playwright install guide
app: https://playwright.dev
profile: smoke
voice: { voice: XrExE9yKIg1WjnnlVkGX }   # Matilda (ElevenLabs featured), Eleven v3
theme: { accent: "#2ead33", background: "#1b2129", background2: "#24302b", palette: ["#e2574c"], backdrop: gradient }
mock:
  text:
    - { find: "Playwright enables reliable", replace: "MOCKED: Playwright enables reliable" }
steps:
  - id: intro
    card: { kicker: Smoke test, title: Find the install guide, subtitle: Two clicks from the home page. }
    say: Here is how to find the install guide.
  - id: home
    title: Open the docs
    say: Start on the home page, and open the Docs.
    do:
      - goto: https://playwright.dev
      - click: { role: link, name: Docs, exact: true }
        sync: Docs
  - id: search
    title: Search the docs
    say: Use search to jump anywhere. Type install.
    do:
      - waitForUrl: "**/docs/intro"
      - click: { role: button, name: Search }
        sync: search
      - type: install
  - id: outro
    card: { title: That's it, bullets: [Open the docs, Search for anything] }
    say: That's all it takes.
