<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  :root {
    --bg: #0f1115;
    --bg2: #1b1f27;
    --accent: #6d5efc;
    --text: #ffffff;
    --font: "Inter", -apple-system, "SF Pro Text", "Helvetica Neue", Arial, sans-serif;
    --heading: var(--font);
    --on-accent: #ffffff;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1920px; height: 1080px; overflow: hidden; background: var(--bg); font-family: var(--font); -webkit-font-smoothing: antialiased; }
  #stage { position: absolute; inset: 0; background: radial-gradient(120% 120% at 15% 0%, var(--bg2) 0%, var(--bg) 60%); }
  #window {
    position: absolute; left: 114px; top: 100px; width: 1692px; height: 952px;
    border-radius: 14px; overflow: hidden; background: #fff;
    box-shadow: 0 30px 80px rgba(0,0,0,.45), 0 0 0 1px rgba(255,255,255,.06);
  }
  #cam, #cam2, #cam3 { position: absolute; left: 0; top: 0; transform-origin: 0 0; }
  #cam img, #cam2 img { position: absolute; left: 0; top: 0; display: block; }
  #fade { opacity: 0; }
  #ring {
    position: absolute; border-radius: 10px; opacity: 0;
    box-shadow: 0 0 0 3px var(--accent), 0 0 0 9px color-mix(in srgb, var(--accent) 28%, transparent), 0 0 0 9999px rgba(10,12,16,.28);
  }
  #ringlabel {
    position: absolute; padding: 5px 10px; border-radius: 8px; background: var(--accent); color: #fff;
    font-size: 13px; font-weight: 600; white-space: nowrap; opacity: 0;
  }
  #ripple { position: absolute; width: 44px; height: 44px; margin: -22px 0 0 -22px; border-radius: 50%; border: 3px solid var(--accent); opacity: 0; }
  #cursor { position: absolute; width: 22px; height: 22px; transform-origin: 3px 2px; filter: drop-shadow(0 2px 3px rgba(0,0,0,.35)); }
  #chip {
    position: absolute; left: 114px; top: 28px; display: flex; align-items: center; gap: 12px;
    padding: 10px 18px 10px 10px; border-radius: 999px; background: rgba(17,19,24,.86); color: #fff;
    font-size: 22px; font-weight: 600; letter-spacing: -.01em; backdrop-filter: blur(8px); opacity: 0;
  }
  #chip b { display: inline-flex; align-items: center; justify-content: center; width: 34px; height: 34px; border-radius: 50%; background: var(--accent); font-size: 17px; }
  #caption { z-index: 6; }
  #scene { z-index: 4; position: absolute; inset: 0; width: 1920px; height: 1080px; border: 0; opacity: 0; background: transparent; pointer-events: none; }
  #title { position: absolute; right: 114px; top: 38px; font-size: 22px; font-weight: 500; color: color-mix(in srgb, var(--text) 55%, transparent); letter-spacing: -.005em; }
  #caption { z-index: 5;
    position: absolute; left: 50%; bottom: 64px; transform: translateX(-50%); max-width: 1300px;
    padding: 14px 26px; border-radius: 14px; background: rgba(12,14,18,.82); color: #fff; text-align: center;
    font-size: 34px; line-height: 1.3; font-weight: 500; letter-spacing: -.005em; opacity: 0;
  }
  /* Cards: an aurora field, words that blur in, the product floating in 3D. */
  #card { position: absolute; inset: 0; opacity: 0; color: var(--text); background: var(--bg); overflow: hidden; }
  #aurora { position: absolute; inset: 0; width: 100%; height: 100%; }
  #grain { position: absolute; inset: -50%; opacity: .07; mix-blend-mode: overlay;
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='3' stitchTiles='stitch'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>"); }
  #card .text { position: absolute; left: 150px; top: 0; bottom: 0; width: 900px; display: flex; flex-direction: column; justify-content: center; }
  #card.wide .text { width: 1500px; }
  #card .kicker { display: inline-flex; align-self: flex-start; align-items: center; gap: 12px; padding: 9px 18px; border-radius: 999px;
    font-size: 22px; font-weight: 600; letter-spacing: .1em; text-transform: uppercase; margin-bottom: 34px;
    color: var(--text); background: color-mix(in srgb, var(--accent) 22%, transparent); box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--accent) 55%, transparent); }
  #card .kicker:before { content: ''; width: 9px; height: 9px; border-radius: 50%; background: var(--accent); box-shadow: 0 0 14px var(--accent); }
  #card .kicker:empty { display: none; }
  #card h1 { font-family: var(--heading); font-size: 96px; line-height: 1.02; letter-spacing: -.04em; font-weight: 750; }
  #card h1 span { display: inline-block; white-space: pre; will-change: transform, filter, opacity; }
  #card h1 span.hl { background: linear-gradient(100deg, var(--text) 10%, color-mix(in srgb, var(--accent) 55%, var(--text)) 60%, var(--accent)); -webkit-background-clip: text; background-clip: text; color: transparent; }
  #card p { margin-top: 30px; font-size: 34px; line-height: 1.4; color: color-mix(in srgb, var(--text) 74%, transparent); }
  #card ol { margin-top: 46px; list-style: none; display: flex; flex-direction: column; gap: 20px; }
  #card li { display: flex; align-items: center; gap: 22px; font-size: 34px; font-weight: 500; padding: 16px 24px 16px 16px; border-radius: 18px;
    background: color-mix(in srgb, var(--text) 6%, transparent); box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--text) 9%, transparent); backdrop-filter: blur(6px); }
  #card li b { flex: none; display: inline-flex; align-items: center; justify-content: center; width: 50px; height: 50px; border-radius: 14px; background: var(--accent); font-size: 23px; }
  #shotwrap { position: absolute; right: 64px; top: 50%; width: 860px; height: 484px; margin-top: -242px; perspective: 1800px; }
  #shot { position: absolute; inset: 0; border-radius: 18px; overflow: hidden; transform-origin: 30% 50%;
    box-shadow: 0 50px 120px rgba(0,0,0,.55), 0 0 0 1px rgba(255,255,255,.12), 0 0 140px color-mix(in srgb, var(--accent) 35%, transparent); }
  #shot img { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  #shot .ring { position: absolute; border-radius: 8px; box-shadow: 0 0 0 3px var(--accent), 0 0 0 8px color-mix(in srgb, var(--accent) 30%, transparent); }
  #card.chapter .text { left: 0; right: 0; width: auto; align-items: center; text-align: center; }
  #card.chapter .kicker { align-self: center; }
  #card.chapter h1 { font-size: 120px; }
  #card .num { font-size: 260px; font-weight: 800; letter-spacing: -.06em; line-height: .8; margin-bottom: 10px;
    color: transparent; -webkit-text-stroke: 2px color-mix(in srgb, var(--accent) 70%, var(--text)); opacity: .9; }
  #card .num:empty { display: none; }
  /* Vertical (9:16): everything inside the area platform UI leaves free. */
  .vertical #window { border-radius: 30px; }
  .vertical #chip { top: 160px; font-size: 26px; }
  .vertical #title { top: 172px; font-size: 24px; }
  .vertical #caption { bottom: 300px; max-width: 940px; font-size: 40px; }
  .vertical #card .text { left: 80px; right: 80px; width: auto !important; top: 200px; bottom: auto; height: 900px; }
  .vertical #card.chapter .text, .vertical #card.wide .text { top: 120px; bottom: 420px; height: auto; }
  .vertical #shotwrap { right: auto; left: 80px; top: 1130px; width: 920px; height: 518px; margin-top: 0; }
  .vertical #card p, .vertical #card li { font-size: 38px; }
</style>
</head>
<body>
<div id="stage">
  <div id="window">
    <div id="cam">
      <img id="frame">
    </div>
    <div id="cam2"><img id="fade"></div>
    <div id="cam3">
      <div id="ring"></div>
      <div id="ringlabel"></div>
      <div id="ripple"></div>
      <svg id="cursor" viewBox="0 0 22 22"><path d="M3 2 L3 18 L7.2 14.2 L10 20.4 L12.9 19.1 L10.2 13 L16 13 Z" fill="#111" stroke="#fff" stroke-width="1.6" stroke-linejoin="round"/></svg>
    </div>
  </div>
  <div id="chip"><b></b><span></span></div>
  <div id="title"></div>
  <div id="caption"></div>
  <div id="card">
    <canvas id="aurora" width="960" height="540"></canvas>
    <iframe id="bdframe" style="position:absolute;inset:0;width:100%;height:100%;border:0;visibility:hidden;pointer-events:none"></iframe>
    <div id="grain"></div>
    <div id="shotwrap"><div id="shot"><img><div class="ring"></div></div></div>
    <div class="text"><div class="num"></div><div class="kicker"></div><h1></h1><p></p><ol></ol></div>
  </div>
  <iframe id="scene" scrolling="no"></iframe>
</div>
<script src="../node_modules/motion/dist/motion.js"></script>
<script>
  const $ = (id) => document.getElementById(id);
  let W = 1280, H = 720;
  let WIN_W = 1692, WIN_H = 952;
  // The frame: set by setup() from src/format.ts.
  let G = { width: 1920, height: 1080, safe: { left: 60, top: 54, right: 1860, bottom: 1026 }, captionTop: 890 };
  let VERTICAL = false;

  window.setup = (opts) => {
    W = opts.width; H = opts.height;
    if (opts.geometry) {
      G = opts.geometry;
      VERTICAL = G.height > G.width;
      document.documentElement.classList.toggle('vertical', VERTICAL);
      for (const el of [document.documentElement, document.body, $('scene')]) { el.style.width = G.width + 'px'; el.style.height = G.height + 'px'; }
      Object.assign($('window').style, { left: G.window.x + 'px', top: G.window.y + 'px', width: G.window.w + 'px', height: G.window.h + 'px' });
      WIN_W = G.window.w; WIN_H = G.window.h;
      if (VERTICAL) { $('chip').style.left = G.window.x + 'px'; $('title').style.right = G.window.x + 'px'; $('aurora').width = 540; $('aurora').height = 960; }
    }
    for (const img of [$('frame'), $('fade')]) { img.style.width = W + 'px'; img.style.height = H + 'px'; }
    const r = document.documentElement.style;
    if (opts.theme.background) r.setProperty('--bg', opts.theme.background);
    if (opts.theme.background2) r.setProperty('--bg2', opts.theme.background2);
    if (opts.theme.accent) r.setProperty('--accent', opts.theme.accent);
    if (opts.theme.font) r.setProperty('--font', opts.theme.font);
    if (opts.theme.headingFont) r.setProperty('--heading', opts.theme.headingFont);
    window.PALETTE_EXTRA = opts.theme.palette || [];
    window.PALETTE = [opts.theme.background, opts.theme.background2, opts.theme.accent, opts.theme.text, ...window.PALETTE_EXTRA].filter(Boolean);
    window.FONTS_CSS = opts.fontsCss || '';
    // The default backdrop (theme.backdrop); a step can choose another.
    window.BACKDROP = opts.backdrop || 'aurora';
    if (opts.theme.text) r.setProperty('--text', opts.theme.text);
    if (opts.theme.onAccent) r.setProperty('--on-accent', opts.theme.onAccent);
    $('title').textContent = opts.title || '';
    window.GSAP_DIR = opts.gsapDir;
    window.LIFT_DIR = opts.liftDir;
    // The app's own look (from probe): colours and fonts for scenes that want it.
    window.APP_THEME = opts.appTheme || {};
    if (opts.fontsCss) {
      const st = document.createElement('style');
      st.textContent = opts.fontsCss;
      document.head.appendChild(st);
    }
  };

  async function load(img, src) {
    if (!src) { img.removeAttribute('src'); return; }
    if (img.dataset.src === src) return;
    img.dataset.src = src;
    img.src = src;
    await img.decode().catch(() => {});
  }


  // ---- Cards -------------------------------------------------------------
  // Every value is sampled from the card's age, never from the clock, so a
  // frame drawn twice is drawn the same. Springs come from motion.dev.
  const springs = new Map();
  function spring(age, delay = 0, stiffness = 120, damping = 17) {
    const t = age - delay;
    if (t <= 0) return 0;
    const key = stiffness + ':' + damping;
    if (!springs.has(key)) springs.set(key, Motion.spring({ keyframes: [0, 1], stiffness, damping, mass: 1 }));
    return springs.get(key).next(t * 1000).value;
  }
  const clamp01 = (v) => Math.max(0, Math.min(1, v));

  // The shot's resting pose; the entrance spring ends exactly here.
  const SHOT_REST = 'translateX(0px) translateY(0px) rotateY(-17deg) rotateX(5deg) rotateZ(-1.5deg)';

  // Largest size at which every word fits the column, in three lines at most.
  let fitted = null;
  function fitTitle(h1, width, chapter) {
    const key = h1.textContent + '|' + width + '|' + chapter;
    if (fitted && fitted.key === key) { h1.style.fontSize = fitted.size + 'px'; return; }
    const sizes = chapter ? [120, 104, 92, 80, 68] : [96, 88, 80, 72, 66, 60, 54];
    let size = sizes[sizes.length - 1];
    for (const s of sizes) {
      h1.style.fontSize = s + 'px';
      const lines = Math.round(h1.getBoundingClientRect().height / (s * 1.02));
      if (h1.scrollWidth <= h1.clientWidth + 1 && lines <= 3) { size = s; break; }
    }
    h1.style.fontSize = size + 'px';
    fitted = { key, size };
  }

  // What a person would catch in a still: text under the screenshot, off the
  // frame, or clipped; the step chip running into the title. Measured on the
  // glyphs (a Range), not on the boxes, with transforms applied.
  // Captions sit at the bottom of the frame; full-frame text stays above them.
  // Colours outside the brand palette: saturated colours (text, fills, strokes, borders) in a scene or
  // card whose hue is far from every palette colour. A lifted panel in the app's own colour inside a
  // video that wears another brand is the usual case; `retint` fixes it. Warnings, not failures.
  window.paletteIssues = () => {
    const hsl = (c) => {
      const m = c && c.match(/[\d.]+/g)?.map(Number);
      if (!m || m.length < 3 || (m.length > 3 && m[3] < 0.2)) return null;
      const [r, g, b] = m.slice(0, 3).map((v) => v / 255);
      const max = Math.max(r, g, b), min = Math.min(r, g, b), l = (max + min) / 2, d = max - min;
      if (!d) return { h: 0, s: 0, l };
      const s = d / (1 - Math.abs(2 * l - 1));
      const h = max === r ? 60 * (((g - b) / d) % 6) : max === g ? 60 * ((b - r) / d + 2) : 60 * ((r - g) / d + 4);
      return { h: (h + 360) % 360, s, l };
    };
    const probe = document.createElement('i');
    document.body.appendChild(probe);
    const brand = (window.PALETTE || []).map((c) => { probe.style.color = c; return hsl(getComputedStyle(probe).color); }).filter((x) => x && x.s >= 0.2);
    probe.remove();
    if (!brand.length) return [];
    const loud = (x) => x && x.s >= 0.45 && x.l > 0.18 && x.l < 0.85;
    const off = (x) => brand.every((b) => Math.min(Math.abs(x.h - b.h), 360 - Math.abs(x.h - b.h)) > 26);
    const seen = new Map();
    const look = (doc, win, where) => {
      for (const el of doc.querySelectorAll('body *')) {
        const r = el.getBoundingClientRect();
        if (r.width < 2 || r.height < 2 || el.closest('[aria-hidden=true]')) continue;
        const cs = win.getComputedStyle(el);
        if (cs.visibility === 'hidden' || +cs.opacity === 0) continue;
        for (const prop of ['color', 'background-color', 'fill', 'stroke', 'border-top-color']) {
          if (prop === 'color' && !el.childNodes.length) continue;
          if (prop === 'border-top-color' && parseFloat(cs.borderTopWidth) < 1) continue;
          const v = cs.getPropertyValue(prop);
          const x = hsl(v);
          if (!loud(x) || !off(x)) continue;
          const key = `${where}|${v}`;
          const e = seen.get(key) || { where, v, n: 0, text: '' };
          e.n++;
          e.text ||= (el.textContent || '').trim().slice(0, 30);
          seen.set(key, e);
        }
      }
    };
    const frame = $('scene');
    if (+frame.style.opacity > 0 && frame.contentDocument) look(frame.contentDocument, frame.contentWindow, 'scene');
    if (+$('card').style.opacity > 0) look(document, window, 'card');
    const out = [...seen.values()].filter((e) => e.n >= 2).sort((a, b) => b.n - a.n).slice(0, 4)
      .map((e) => `${e.where} uses ${e.v} (${e.n} elements${e.text ? `, e.g. "${e.text}"` : ''}), outside the palette: retint it or add it to theme.palette`);
    if (+frame.style.opacity > 0 && frame.contentDocument) out.push(...faintText(frame.contentDocument, frame.contentWindow));
    return out;
  };

  // Text too faint to read: a scene's text against what is behind it (its nearest solid background,
  // else the video's background), e.g. light-on-light from a scene written for a dark theme.
  function faintText(doc, win) {
    const rgba = (c) => { const m = c && c.match(/[\d.]+/g)?.map(Number); return m && m.length >= 3 ? [m[0], m[1], m[2], m.length > 3 ? m[3] : 1] : null; };
    const lum = ([r, g, b]) => { const f = (v) => { v /= 255; return v <= 0.03928 ? v / 12.92 : ((v + 0.055) / 1.055) ** 2.4; }; return 0.2126 * f(r) + 0.7152 * f(g) + 0.0722 * f(b); };
    const over = (top, under) => top.slice(0, 3).map((v, i) => v * top[3] + under[i] * (1 - top[3]));
    const page = rgba(getComputedStyle(document.documentElement).getPropertyValue('--bg').trim() ? (() => { const i = document.createElement('i'); i.style.color = 'var(--bg)'; document.body.appendChild(i); const c = getComputedStyle(i).color; i.remove(); return c; })() : 'rgb(0,0,0)');
    const found = new Map();
    for (const el of doc.querySelectorAll('body *')) {
      if (![...el.childNodes].some((n) => n.nodeType === 3 && n.textContent.trim())) continue;
      const cs = win.getComputedStyle(el);
      const fg = rgba(cs.color);
      if (!fg || fg[3] < 0.05 || cs.visibility === 'hidden' || /text/.test(cs.backgroundClip + cs.webkitBackgroundClip)) continue;
      const r = el.getBoundingClientRect();
      if (r.width < 2 || r.height < 2) continue;
      // Settled, fully shown text only: mid-fade text is faint on purpose.
      let shown = 1, behind = null, unknown = false;
      for (let a = el; a && a.nodeType === 1; a = a.parentElement) {
        const ac = win.getComputedStyle(a);
        shown *= +ac.opacity;
        if (!behind && ac.backgroundImage !== 'none') unknown = true;
        const bg = rgba(ac.backgroundColor);
        if (!behind && !unknown && bg && bg[3] >= 0.6) behind = over(bg, page);
      }
      if (shown < 0.95 || (unknown && !behind)) continue;
      const back = behind || page;
      const L1 = lum(over(fg, back)), L2 = lum(back);
      const ratio = (Math.max(L1, L2) + 0.05) / (Math.min(L1, L2) + 0.05);
      if (ratio >= 3) continue;
      const text = el.textContent.trim().slice(0, 30);
      if (!found.has(text)) found.set(text, ratio);
    }
    return [...found].slice(0, 4).map(([text, ratio]) => `scene text "${text}" is hard to read (contrast ${ratio.toFixed(1)}:1, aim for 4.5): use var(--text) or a mix of it`);
  }

  window.layoutIssues = () => {
    const CAPTION_TOP = G.captionTop, S = G.safe;
    const issues = [];
    const glyphs = (el) => {
      const range = document.createRange();
      range.selectNodeContents(el);
      return [...range.getClientRects()].reduce((a, b) => ({ left: Math.min(a.left, b.left), right: Math.max(a.right, b.right), top: Math.min(a.top, b.top), bottom: Math.max(a.bottom, b.bottom) }),
        { left: Infinity, right: -Infinity, top: Infinity, bottom: -Infinity });
    };
    const hit = (a, b) => a.right > b.left + 2 && a.left < b.right - 2 && a.bottom > b.top + 2 && a.top < b.bottom - 2;
    const say = (el) => `"${el.textContent.trim().slice(0, 48)}"`;
    const card = $('card');
    if (Number(card.style.opacity) > 0) {
      const shot = $('shotwrap').style.display !== 'none' ? $('shot').getBoundingClientRect() : null;
      for (const el of card.querySelectorAll('.kicker, .num, h1, p, li')) {
        if (!el.textContent.trim()) continue;
        const g = glyphs(el);
        const name = el.tagName.toLowerCase();
        // Title-safe area, as in broadcast: ~5% in from every edge.
        if (g.left < S.left || g.top < S.top || g.right > S.right || g.bottom > S.bottom) issues.push(`${name} leaves the safe area: ${say(el)}`);
        if (shot && hit(g, shot)) issues.push(`${name} runs under the screenshot: ${say(el)}`);
        if (g.bottom > CAPTION_TOP) issues.push(`${name} sits where captions go: ${say(el)}`);
        if (el.scrollWidth > el.clientWidth + 1) issues.push(`${name} is clipped: ${say(el)}`);
      }
    }
    // Inside a scene: every block of text in the safe area, unclipped, and
    // not colliding with another block.
    const frame = $('scene');
    if (Number(frame.style.opacity) > 0 && frame.contentDocument) {
      const doc = frame.contentDocument;
      // Seen: not hidden, and not faded out by itself or anything around it (a crossfade's old layer).
      const seen = (el) => {
        let o = 1;
        for (let a = el; a && a !== doc.body; a = a.parentElement) o *= Number(frame.contentWindow.getComputedStyle(a).opacity);
        return o > 0.05;
      };
      const blocks = [...doc.body.querySelectorAll('*')].filter((el) =>
        [...el.childNodes].some((n) => n.nodeType === 3 && n.nodeValue.trim()) && frame.contentWindow.getComputedStyle(el).visibility !== 'hidden' && seen(el));
      // Text entirely clipped away by an overflow-hidden parent (a phone screen, a mask) isn't on screen.
      const shown = (el, g) => {
        for (let a = el.parentElement; a && a !== doc.body; a = a.parentElement) {
          if (frame.contentWindow.getComputedStyle(a).overflow === 'visible') continue;
          const r = a.getBoundingClientRect();
          if (g.right <= r.left || g.left >= r.right || g.bottom <= r.top || g.top >= r.bottom) return false;
        }
        return true;
      };
      const boxes = blocks.map((el) => ({ el, g: glyphs(el) })).filter((b) => b.g.right > b.g.left && shown(b.el, b.g));
      if (!boxes.length) issues.push(`scene shows nothing: no visible text in ${frame.dataset.src.split('/').pop()}`);
      for (const { el, g } of boxes) {
        if (g.left < S.left || g.top < S.top || g.right > S.right || g.bottom > S.bottom) issues.push(`scene text leaves the safe area: ${say(el)}`);
        // A lift's own truncation (an ellipsis in the app) is the app's design, not a layout fault.
        if (!el.closest('[data-lift]') && el.scrollWidth > el.clientWidth + 1 && frame.contentWindow.getComputedStyle(el).overflow !== 'visible') issues.push(`scene text is clipped: ${say(el)}`);
        if (g.bottom > CAPTION_TOP) issues.push(`scene text sits where captions go: ${say(el)}`);
      }
      for (let i = 0; i < boxes.length; i++) for (let j = i + 1; j < boxes.length; j++) {
        const a = boxes[i], b = boxes[j];
        if (a.el.contains(b.el) || b.el.contains(a.el)) continue;
        // A lift is the app's own layout: its text is not checked against itself.
        const la = a.el.closest('[data-lift]'), lb = b.el.closest('[data-lift]');
        if (la && la === lb) continue;
        // Range boxes are the font's content area (~1.2× its size), taller than the ink: stacked display
        // lines overlap there without touching. Allow that much, in proportion to the type.
        const fs = Math.min(parseFloat(frame.contentWindow.getComputedStyle(a.el).fontSize), parseFloat(frame.contentWindow.getComputedStyle(b.el).fontSize));
        const slack = Math.max(2, fs * 0.14);
        // Line by line: text that wraps (an inline run over two lines) is two boxes, not their union.
        const lines = (el) => { const r = doc.createRange(); r.selectNodeContents(el); return [...r.getClientRects()].filter((x) => x.width > 1); };
        const hit = (p, q) => p.right > q.left + 2 && p.left < q.right - 2 && p.bottom > q.top + slack && p.top < q.bottom - slack;
        const over = hit(a.g, b.g) && lines(a.el).some((p) => lines(b.el).some((q) => hit(p, q)));
        if (over) issues.push(`scene text collides: ${say(a.el)} and ${say(b.el)}`);
      }
    }
    const chip = $('chip');
    if (Number(chip.style.opacity) > 0 && $('title').textContent && hit(chip.getBoundingClientRect(), glyphs($('title')))) issues.push(`step title runs into the video title: ${say(chip)}`);
    return issues;
  };

  let builtTitle = null;
  function buildTitle(h1, title, highlight) {
    const key = title + '|' + (highlight || '');
    if (builtTitle === key) return;
    builtTitle = key;
    h1.innerHTML = '';
    const hl = new Set((highlight || '').toLowerCase().split(/\s+/).filter(Boolean));
    title.split(/(\s+)/).forEach((w) => {
      // Spaces stay plain text, so a wrapped line doesn't start with one.
      if (!w.trim()) return void h1.append(' ');
      const span = document.createElement('span');
      span.textContent = w;
      if (hl.has(w.toLowerCase().replace(/[^\p{L}\p{N}]/gu, ''))) span.className = 'hl';
      h1.appendChild(span);
    });
  }

  function drawCard(c, t) {
    const card = $('card');
    card.style.opacity = c ? String(c.alpha) : '0';
    if (!c) return;
    const age = c.age;
    card.className = (c.style === 'chapter' ? 'chapter' : '') + (c.image ? '' : ' wide');
    card.querySelector('.text').style.display = c.style === 'scene' ? 'none' : '';
    if (c.style === 'scene') { $('shotwrap').style.display = 'none'; backdrop(t, 0.8, c.backdrop); return; }

    // Lay out before animating: the text column ends where the tilted shot
    // really begins on screen, and the title shrinks until it fits it.
    const text = card.querySelector('.text');
    const wrap = $('shotwrap');
    wrap.style.display = c.image ? 'block' : 'none';
    let column = VERTICAL ? 920 : c.style === 'chapter' ? 1620 : 1500;
    if (c.image && !VERTICAL) {
      $('shot').style.transform = SHOT_REST;
      column = Math.max(560, Math.floor($('shot').getBoundingClientRect().left) - 150 - 72);
    }
    text.style.width = c.style === 'chapter' || VERTICAL ? '' : column + 'px';
    if (c.image && VERTICAL) $('shot').style.transform = SHOT_REST;
    backdrop(t, c.style === 'chapter' ? 1.3 : 1, c.backdrop);

    const kicker = card.querySelector('.kicker');
    kicker.textContent = c.kicker || '';
    const pk = spring(age, 0.05);
    kicker.style.opacity = clamp01(pk);
    kicker.style.transform = `translateY(${(1 - pk) * 18}px)`;

    const num = card.querySelector('.num');
    num.textContent = c.style === 'chapter' && c.number ? String(c.number).padStart(2, '0') : '';
    const pn = spring(age, 0, 90, 16);
    num.style.opacity = clamp01(pn) * .9;
    num.style.transform = `translateY(${(1 - pn) * 40}px) scale(${0.9 + 0.1 * pn})`;

    const h1 = card.querySelector('h1');
    buildTitle(h1, c.title, c.highlight);
    fitTitle(h1, column, c.style === 'chapter');
    const words = [...h1.children].filter((x) => x.textContent.trim());
    words.forEach((el, i) => {
      const p = spring(age, 0.12 + i * 0.075, 110, 16);
      el.style.opacity = clamp01(p * 1.4);
      el.style.filter = `blur(${(1 - clamp01(p)) * 16}px)`;
      el.style.transform = `translateY(${(1 - p) * 34}px)`;
    });
    const after = 0.12 + words.length * 0.075;

    const sub = card.querySelector('p');
    sub.textContent = c.subtitle || '';
    const ps = spring(age, after + 0.1);
    sub.style.opacity = clamp01(ps);
    sub.style.transform = `translateY(${(1 - ps) * 16}px)`;

    const ol = card.querySelector('ol');
    const bullets = c.bullets || [];
    if (ol.dataset.key !== bullets.join('|')) {
      ol.dataset.key = bullets.join('|');
      ol.innerHTML = bullets.map(() => '<li><b></b><span></span></li>').join('');
    }
    [...ol.children].forEach((li, i) => {
      li.querySelector('b').textContent = (c.start || 1) + i;
      li.querySelector('span').textContent = bullets[i];
      const p = spring(age, after + 0.25 + i * 0.16, 130, 18);
      li.style.opacity = clamp01(p);
      li.style.transform = `translateX(${(1 - p) * -40}px)`;
    });

    if (c.image) {
      const shot = $('shot');
      const img = shot.querySelector('img');
      if (img.dataset.src !== c.image) { img.dataset.src = c.image; img.src = c.image; }
      const p = spring(age, 0.2, 70, 15);
      const float = Math.sin(age * 0.9) * 7;
      shot.style.opacity = clamp01(p * 1.3);
      shot.style.transform = `translateX(${(1 - p) * 220}px) translateY(${float}px) rotateY(${-17 - (1 - p) * 14}deg) rotateX(${5 + (1 - p) * 4}deg) rotateZ(${-1.5}deg)`;
      const ring = shot.querySelector('.ring');
      ring.style.display = c.ring ? 'block' : 'none';
      if (c.ring) {
        const k = 860 / W, pad = 5;
        Object.assign(ring.style, { left: (c.ring.x * k - pad) + 'px', top: (c.ring.y * k - pad) + 'px', width: (c.ring.w * k + 2 * pad) + 'px', height: (c.ring.h * k + 2 * pad) + 'px' });
        ring.style.opacity = clamp01(spring(age, 0.9));
      }
    }
  }

  // ---- Backdrops ---------------------------------------------------------
  // The field behind cards and scenes: a fragment shader in the theme's colours, drawn at half size.
  // Built-ins below; `{ shader: file.frag }` brings a brand's own. Every shader gets the same uniforms:
  // t (seconds), res, bg, bg2, acc, c1–c4 (theme.palette), as vec3 colours.
  const GLSL_LIB = `precision highp float;
    uniform float t; uniform vec2 res; uniform vec3 bg; uniform vec3 bg2; uniform vec3 acc; uniform vec3 c1; uniform vec3 c2; uniform vec3 c3; uniform vec3 c4;
    float h(vec2 p){ return fract(sin(dot(p, vec2(127.1, 311.7))) * 43758.5453); }
    float n(vec2 p){ vec2 i = floor(p), f = fract(p); f = f*f*(3.-2.*f);
      return mix(mix(h(i), h(i+vec2(1,0)), f.x), mix(h(i+vec2(0,1)), h(i+vec2(1,1)), f.x), f.y); }
    float fbm(vec2 p){ float v = 0., a = .5; for (int i = 0; i < 5; i++){ v += a*n(p); p = p*2.02 + 3.1; a *= .5; } return v; }
  `;
  const BACKDROPS = {
    // Flowing bands of the accent over the background: the original look.
    aurora: `void main(){
      vec2 uv = gl_FragCoord.xy / res; vec2 p = uv * vec2(res.x/res.y, 1.);
      float w = fbm(vec2(p.x*1.4 + t*.05, t*.04));
      float band = smoothstep(.0, .55, .32 - abs(uv.y - .38 - w*.35 + .1*sin(p.x*2.2 + t*.25)));
      float band2 = smoothstep(.0, .5, .2 - abs(uv.y - .62 + w*.25 - .08*sin(p.x*1.6 - t*.2)));
      vec3 a2 = mix(acc, c1, .45);
      vec3 col = bg + acc * band * .55 * (.6 + .7*fbm(p*3. + t*.08)) + a2 * band2 * .32;
      col += acc * .10 * (1. - uv.y);
      col *= .82 + .18 * smoothstep(1.3, .2, length(uv - vec2(.35, .45)));
      gl_FragColor = vec4(col, 1.);
    }`,
    // A mesh gradient: four soft colour fields drifting over each other (bg2, accent, palette).
    mesh: `void main(){
      vec2 uv = gl_FragCoord.xy / res; vec2 p = uv * vec2(res.x/res.y, 1.);
      vec2 q = p + .18 * vec2(fbm(p*1.3 + t*.06), fbm(p*1.3 - t*.05 + 4.));
      float a = smoothstep(.85, 0., length(q - vec2(.35 + .15*sin(t*.21), .3 + .1*cos(t*.17))));
      float b = smoothstep(.9, 0., length(q - vec2(1.35 + .2*cos(t*.13), .75 + .1*sin(t*.19))));
      float c = smoothstep(.8, 0., length(q - vec2(.9 + .25*sin(t*.11), 1.05)));
      float d = smoothstep(.7, 0., length(q - vec2(1.6, .15 + .1*sin(t*.23))));
      vec3 col = mix(bg, bg2, uv.y);
      col = mix(col, acc, a * .55); col = mix(col, c1, b * .45); col = mix(col, c2, c * .35); col = mix(col, bg2, d * .5);
      col += (h(gl_FragCoord.xy + t) - .5) * .025;
      gl_FragColor = vec4(col, 1.);
    }`,
    // A floor grid running to a glowing horizon: technical, architectural.
    grid: `void main(){
      vec2 uv = gl_FragCoord.xy / res; vec2 p = (gl_FragCoord.xy - .5*res) / res.y;
      float hz = -.08; vec3 col = mix(bg, bg2, smoothstep(-.5, .5, p.y));
      if (p.y < hz) {
        float z = .35 / (hz - p.y); vec2 g = vec2(p.x * z, z + t * .6);
        vec2 l = abs(fract(g) - .5) / fwidth(g);
        float line = 1. - min(min(l.x, l.y), 1.);
        col += acc * line * .55 * smoothstep(9., 1., z);
      }
      col += acc * .35 * exp(-abs(p.y - hz) * 18.) + c1 * .12 * exp(-length(p - vec2(0., hz)) * 3.);
      gl_FragColor = vec4(col, 1.);
    }`,
    // Light falling from above in slow rays: a stage, a reveal.
    rays: `void main(){
      vec2 uv = gl_FragCoord.xy / res; vec2 p = (gl_FragCoord.xy - vec2(.5*res.x, 1.15*res.y)) / res.y;
      float a = atan(p.x, -p.y), r = length(p);
      float ray = pow(.5 + .5*sin(a * 14. + t * .35 + 2.*fbm(vec2(a*3., t*.1))), 6.) * smoothstep(1.6, .2, r);
      vec3 col = mix(bg, bg2, uv.y) + mix(acc, c1, .3) * ray * .35 + acc * .25 * smoothstep(1.2, 0., r);
      gl_FragColor = vec4(col, 1.);
    }`,
    // Ribbons of colour in slow waves: calm, friendly.
    waves: `void main(){
      vec2 uv = gl_FragCoord.xy / res; vec2 p = uv * vec2(res.x/res.y, 1.);
      vec3 col = mix(bg, bg2, uv.y);
      for (int i = 0; i < 4; i++) {
        float fi = float(i);
        float y = .22 + fi * .17 + .06 * sin(p.x * (1.6 + fi*.4) + t * (.3 + fi*.07) + fi) + .03 * sin(p.x * 4. - t * .5);
        float band = smoothstep(.07, 0., abs(uv.y - y)) ;
        vec3 c = i == 0 ? acc : i == 1 ? c1 : i == 2 ? c2 : bg2;
        col = mix(col, c, band * .38);
      }
      gl_FragColor = vec4(col, 1.);
    }`,
    // A halftone dot field, its dots swelling with slow noise: print, editorial.
    dots: `void main(){
      vec2 uv = gl_FragCoord.xy / res; float s = 22.;
      vec2 cell = floor(gl_FragCoord.xy / s), f = fract(gl_FragCoord.xy / s) - .5;
      float v = fbm(cell * .06 + vec2(t*.05, -t*.03));
      float dot = smoothstep(.02, 0., length(f) - .42 * smoothstep(.35, .75, v));
      vec3 col = mix(bg, bg2, uv.y) + mix(acc, c1, uv.x) * dot * .45;
      gl_FragColor = vec4(col, 1.);
    }`,
    // Flat colour with film grain and a soft vignette: minimal, lets the content speak.
    grain: `void main(){
      vec2 uv = gl_FragCoord.xy / res;
      vec3 col = mix(bg2, bg, smoothstep(0., 1.1, length(uv - vec2(.5, .55))));
      col += (h(gl_FragCoord.xy + floor(t*12.)) - .5) * .05;
      gl_FragColor = vec4(col, 1.);
    }`,
    solid: `void main(){ gl_FragColor = vec4(bg, 1.); }`,
    // Liquid: domain-warped noise, like ink folding in water.
    liquid: `void main(){
      vec2 uv = gl_FragCoord.xy / res; vec2 p = uv * vec2(res.x/res.y, 1.) * 1.6;
      vec2 q = vec2(fbm(p + t*.04), fbm(p + 5.2 - t*.03));
      vec2 r = vec2(fbm(p + 3.*q + 1.7 + t*.05), fbm(p + 3.*q + 9.2));
      float v = fbm(p + 3.5*r);
      vec3 col = mix(bg, bg2, v); col = mix(col, acc, smoothstep(.55, .9, v) * .7); col = mix(col, c1, smoothstep(.75, 1., length(q)) * .35);
      gl_FragColor = vec4(col, 1.);
    }`,
    // Plasma: the classic sum of sines, in the palette.
    plasma: `void main(){
      vec2 p = (gl_FragCoord.xy - .5*res) / res.y * 3.;
      float v = sin(p.x + t*.5) + sin(p.y*1.3 - t*.4) + sin((p.x + p.y)*.8 + t*.3) + sin(length(p + vec2(sin(t*.2), cos(t*.25)))*2. - t*.6);
      v = .5 + .5*sin(v * 1.3);
      vec3 col = mix(mix(bg, acc, smoothstep(.2, .7, v)), c1, smoothstep(.65, 1., v) * .6);
      gl_FragColor = vec4(mix(bg, col, .8), 1.);
    }`,
    // Cells: a slowly shifting Voronoi pattern, edges lit in the accent.
    cells: `vec2 hh(vec2 p){ return fract(sin(vec2(dot(p, vec2(127.1, 311.7)), dot(p, vec2(269.5, 183.3)))) * 43758.5453); }
    void main(){
      vec2 uv = gl_FragCoord.xy / res; vec2 p = uv * vec2(res.x/res.y, 1.) * 5.;
      vec2 i = floor(p), f = fract(p); float d1 = 8., d2 = 8.; vec2 id;
      for (int y = -1; y <= 1; y++) for (int x = -1; x <= 1; x++) {
        vec2 g = vec2(x, y), o = hh(i + g); o = .5 + .45*sin(t*.4 + 6.2831*o);
        float d = length(g + o - f);
        if (d < d1) { d2 = d1; d1 = d; id = i + g; } else if (d < d2) d2 = d;
      }
      float edge = smoothstep(.06, 0., d2 - d1);
      vec3 col = mix(bg, bg2, h(id)) + acc * edge * .5;
      gl_FragColor = vec4(col, 1.);
    }`,
    // Stripes: bold diagonal bands sliding past: energetic, sporty.
    stripes: `void main(){
      vec2 uv = gl_FragCoord.xy / res; vec2 p = uv * vec2(res.x/res.y, 1.);
      float s = fract((p.x + p.y) * 3. - t * .25);
      float band = smoothstep(.0, .02, s) * smoothstep(.5, .48, s);
      vec3 col = mix(bg, mix(bg2, acc, .25 + .25*sin(p.x*2. + t*.3)), band * .55);
      gl_FragColor = vec4(col, 1.);
    }`,
    // Blueprint: a drafting grid, major and minor lines, a scan line passing.
    blueprint: `void main(){
      vec2 px = gl_FragCoord.xy;
      vec2 a = abs(fract(px / 24.) - .5) * 24., b = abs(fract(px / 120.) - .5) * 120.;
      float minor = 1. - smoothstep(0., 1.2, min(a.x, a.y)), major = 1. - smoothstep(0., 1.5, min(b.x, b.y));
      float scan = exp(-abs(fract(t*.08) * res.y - px.y) * .02);
      vec3 col = bg + acc * (minor * .07 + major * .18) + acc * scan * .08;
      gl_FragColor = vec4(col, 1.);
    }`,
    // Topography: contour lines over a slowly breathing terrain.
    topo: `void main(){
      vec2 uv = gl_FragCoord.xy / res; vec2 p = uv * vec2(res.x/res.y, 1.) * 2.2;
      float e = fbm(p + vec2(t*.02, t*.015)) * 9.;
      // Distance to the nearest contour (an integer height), in pixels: a line where it is small.
      float line = 1. - smoothstep(.5, 1.5, (.5 - abs(fract(e) - .5)) / fwidth(e));
      float major = 1. - smoothstep(.8, 2., (.5 - abs(fract(e / 4.) - .5)) * 4. / fwidth(e));
      vec3 col = mix(bg, bg2, uv.y) + acc * line * .18 + c1 * major * .14;
      gl_FragColor = vec4(col, 1.);

    // Bokeh: out-of-focus lights drifting up: warm, celebratory, evening.
    bokeh: `void main(){
      vec2 uv = gl_FragCoord.xy / res; vec2 p = gl_FragCoord.xy / res.y;
      vec3 col = mix(bg, bg2, uv.y * .8);

        float r = .03 + .07 * h(vec2(fi, 4.));

        float disc = smoothstep(r, r * .85, d) * (.35 + .25 * sin(t + fi));
        col += mix(acc, c1, h(vec2(fi, 5.))) * disc * .35;

      gl_FragColor = vec4(col, 1.);
    }`,
    // Sunburst: radial rays turning slowly behind the centre: a reveal, a celebration, a title.
    sunburst: `void main(){
      vec2 p = (gl_FragCoord.xy - .5*res) / res.y;
      float a = atan(p.y, p.x) + t * .05;
      float ray = step(.5, fract(a / 6.2831 * 18.));
      vec3 col = mix(bg, mix(bg2, acc, .35), ray * .6 * smoothstep(1.2, .1, length(p)));
      col += acc * .3 * smoothstep(.5, 0., length(p));

    }`,
    // Lava: soft metaballs rising and merging.
    lava: `void main(){
      vec2 uv = gl_FragCoord.xy / res; vec2 p = (gl_FragCoord.xy - .5*res) / res.y;
      float f = 0.;
      for (int i = 0; i < 7; i++) {
        float fi = float(i);
        vec2 c = vec2(.7 * sin(t*.13*(1. + fi*.2) + fi*2.), .45 * sin(t*.11*(1. + fi*.15) + fi*1.3));
        f += .018 / dot(p - c, p - c);

      vec3 col = mix(bg, bg2, uv.y) + acc * glow * .2; col = mix(col, mix(acc, c1, uv.y), m * .8);
      gl_FragColor = vec4(col, 1.);
    }`,
    // Stars: a calm night sky with twinkling stars and a faint band of glow.
    stars: `void main(){
      vec2 uv = gl_FragCoord.xy / res; vec2 g = gl_FragCoord.xy / 3.;
      vec2 cell = floor(g / 9.); vec2 f = fract(g / 9.) - .5;
      float r = h(cell); float star = r > .93 ? smoothstep(.12, 0., length(f - (vec2(h(cell + 1.), h(cell + 2.)) - .5) * .7)) : 0.;
      star *= .5 + .5 * sin(t * (1. + 2.*h(cell + 3.)) + r * 30.);
      vec3 col = mix(bg, bg2, uv.y) + acc * .12 * fbm(uv * 3. + t*.01) * smoothstep(.7, .2, abs(uv.y - .6 - .2*uv.x));
      col += mix(vec3(1.), c1, h(cell + 4.) * .5) * star;
      gl_FragColor = vec4(col, 1.);
    }`,
    // Spotlight: two soft spotlights sweeping a dark stage.
    spotlight: `void main(){
      vec2 uv = gl_FragCoord.xy / res; vec2 p = uv * vec2(res.x/res.y, 1.);
      vec2 a = vec2(.6 + .5 * sin(t*.3), .45 + .1 * cos(t*.4)), b = vec2(1.2 + .4 * cos(t*.25), .55 + .1 * sin(t*.35));
      float s = smoothstep(.55, 0., length(p - a)) * .6 + smoothstep(.45, 0., length(p - b)) * .45;
      vec3 col = bg * .8 + mix(acc, c1, .4) * s * .5 + bg2 * s * .6;
      gl_FragColor = vec4(col, 1.);
    }`,
    // Rings: concentric ripples pulsing outward from a point: sound, signal, a drop of water.
    rings: `void main(){
      vec2 p = (gl_FragCoord.xy - vec2(.68, .45)*res) / res.y;
      float d = length(p), r = fract(d * 4. - t * .3);
      float ring = smoothstep(.06, 0., abs(r - .5) - .02) * smoothstep(1.4, .1, d);
      vec3 col = mix(bg, bg2, smoothstep(1., 0., d) * .6) + acc * ring * .35;
      gl_FragColor = vec4(col, 1.);
    }`,
    // Gradient: a soft, grainy two-tone gradient that slowly turns: editorial, premium.
    gradient: `void main(){
      vec2 uv = gl_FragCoord.xy / res; float a = t * .05;
      float k = dot(uv - .5, vec2(cos(a), sin(a))) + .5;
      vec3 col = mix(mix(bg, bg2, smoothstep(0., .6, k)), acc, smoothstep(.55, 1.2, k) * .7);
      col += (h(gl_FragCoord.xy + floor(t*12.)) - .5) * .06;
      gl_FragColor = vec4(col, 1.);
    }`,
    // Sky: a gradient sky with soft clouds drifting: light, outdoors, optimistic.
    sky: `void main(){
      vec2 uv = gl_FragCoord.xy / res; vec2 p = uv * vec2(res.x/res.y, 1.);
      vec3 col = mix(bg2, bg, uv.y);
      float c = smoothstep(.5, .8, fbm(p * vec2(1.5, 3.) + vec2(t * .02, 0.)));
      col = mix(col, mix(vec3(1.), c1, .1), c * .7 * smoothstep(.2, .7, uv.y));
      gl_FragColor = vec4(col, 1.);
    }`,
    // Scanlines: a CRT-style field, lines and a rolling bar: retro, tech, gaming.
    scanlines: `void main(){
      vec2 uv = gl_FragCoord.xy / res;
      float lines = .5 + .5 * sin(gl_FragCoord.y * 1.6);
      float roll = smoothstep(.1, 0., abs(fract(uv.y + t * .05) - .5) - .35);
      vec3 col = mix(bg, bg2, uv.y) * (.85 + .15 * lines) + acc * roll * .06;
      col *= .9 + .1 * smoothstep(1.2, .3, length(uv - .5));
      gl_FragColor = vec4(col, 1.);
    }`,
  };
  let gl, buf;
  const programs = new Map();
  const rgbOf = (v) => { const c = document.createElement('canvas').getContext('2d'); c.fillStyle = (v || '#000').trim(); c.fillRect(0, 0, 1, 1); return [...c.getImageData(0, 0, 1, 1).data].slice(0, 3).map((x) => x / 255); };
  function program(name, src) {
    if (programs.has(name)) return programs.get(name);
    const sh = (type, code) => {
      const o = gl.createShader(type);
      gl.shaderSource(o, code);
      gl.compileShader(o);
      if (!gl.getShaderParameter(o, gl.COMPILE_STATUS)) throw new Error(`backdrop "${name}": ${gl.getShaderInfoLog(o)}`);
      return o;
    };
    const prog = gl.createProgram();
    gl.attachShader(prog, sh(gl.VERTEX_SHADER, 'attribute vec2 p; void main(){ gl_Position = vec4(p, 0., 1.); }'));
    gl.attachShader(prog, sh(gl.FRAGMENT_SHADER, '#extension GL_OES_standard_derivatives : enable\n' + GLSL_LIB + src));
    gl.linkProgram(prog);
    gl.useProgram(prog);
    const loc = gl.getAttribLocation(prog, 'p');
    gl.bindBuffer(gl.ARRAY_BUFFER, buf);
    gl.enableVertexAttribArray(loc);
    gl.vertexAttribPointer(loc, 2, gl.FLOAT, false, 0, 0);
    const css = getComputedStyle(document.documentElement);
    const pal = window.PALETTE_EXTRA;
    const colors = { bg: css.getPropertyValue('--bg'), bg2: css.getPropertyValue('--bg2'), acc: css.getPropertyValue('--accent'), c1: pal[0] || '#3fd5e6', c2: pal[1] || css.getPropertyValue('--bg2'), c3: pal[2] || css.getPropertyValue('--accent'), c4: pal[3] || css.getPropertyValue('--bg2') };
    for (const [k, v] of Object.entries(colors)) gl.uniform3fv(gl.getUniformLocation(prog, k), rgbOf(v));
    const p = { prog, t: gl.getUniformLocation(prog, 't'), res: gl.getUniformLocation(prog, 'res') };
    programs.set(name, p);
    return p;
  }
  // backdrop(t, speed, which): which is a built-in name, or { name, src } for a shader from the spec.
  // A page backdrop (React component, HyperFrames block, any HTML) is loaded before the frame is drawn.
  // A React page renders after its modules load (from esm.sh) and React commits: wait for its root to fill.
  async function rendered(win) {
    const root = win.document.getElementById('root');
    if (!root || !win.document.querySelector('script[type=module]')) return;
    for (let i = 0; i < 150 && !root.childElementCount; i++) {
      win.__showhowClock?.set(win.__showhowClock.time);
      await new Promise((r) => setTimeout(r, 40));
    }
    if (!root.childElementCount) throw new Error('a React page rendered nothing: check its import (browser console) and its export');
  }
  async function loadBackdrop(which) {
    if (!which || typeof which !== 'object' || !which.url) return;
    const f = $('bdframe');
    if (f.dataset.url === which.url) return;
    f.dataset.url = which.url;
    // Hidden by visibility, never display: libraries that pause when off screen (IntersectionObserver)
    // or size themselves to their box (ResizeObserver) must see a full-frame, visible page.
    await new Promise((ok) => { f.onload = ok; f.src = which.url; });
    const win = f.contentWindow;
    await rendered(win);
    await new Promise((r) => setTimeout(r, 150));
    await win.document.fonts.ready;
    win.__showhowClock?.set(0);
    if (win.__timelines && Object.keys(win.__timelines).length) { win.__bdtl = Object.values(win.__timelines)[0]; win.__bdtl.pause(); }
  }
  function backdrop(t, speed, which = window.BACKDROP) {
    const canvas = $('aurora');
    const page = typeof which === 'object' && which && which.url;
    $('bdframe').style.visibility = page ? 'visible' : 'hidden';
    canvas.style.visibility = page ? 'hidden' : 'visible';
    if (page) {
      const win = $('bdframe').contentWindow;
      win.__showhowClock?.set(t * speed);
      // A block's timeline loops over the step: backdrops are ambient.
      if (win.__bdtl) win.__bdtl.seek((t * speed) % Math.max(0.01, win.__bdtl.duration()), false);
      return;
    }
    if (!gl) {
      gl = canvas.getContext('webgl', { preserveDrawingBuffer: true, antialias: false });
      if (!gl) return;
      gl.getExtension('OES_standard_derivatives');
      buf = gl.createBuffer();
      gl.bindBuffer(gl.ARRAY_BUFFER, buf);
      gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 1, -1, -1, 1, 1, 1]), gl.STATIC_DRAW);
    }
    const name = typeof which === 'object' && which ? which.name : which || 'aurora';
    const src = typeof which === 'object' && which ? which.src : BACKDROPS[name];
    if (!src) throw new Error(`no backdrop "${name}" (built in: ${Object.keys(BACKDROPS).join(', ')}; or { shader: file.frag })`);
    const p = program(name, src);
    gl.useProgram(p.prog);
    gl.uniform2f(p.res, canvas.width, canvas.height);
    gl.viewport(0, 0, canvas.width, canvas.height);
    gl.uniform1f(p.t, t * speed);
    gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
  }


  // ---- Scenes ------------------------------------------------------------
  // An HTML page the agent wrote for something the app has no screen for.
  // It gets a kit (springs from motion.dev, the theme) and draws itself from t.
  async function drawScene(sc) {
    const frame = $('scene');
    frame.style.opacity = sc ? String(sc.alpha) : '0';
    if (!sc) return;
    // One build per step: two steps can share a template with different data.
    const key = sc.key ?? sc.src;
    if (frame.dataset.key !== key) {
      frame.dataset.key = key;
      frame.dataset.src = sc.src;
      // A distinct URL per step, so the same template always reloads fresh.
      await new Promise((ok) => { frame.onload = ok; frame.src = `${sc.src}${sc.src.includes('?') ? '&' : '?'}step=${encodeURIComponent(key)}`; });
      const win = frame.contentWindow;
      await rendered(win);
      win.showhow = kit(win, sc);
      await injectGsap(win);
      // Build once, at t = 0: a GSAP timeline (seeked every frame after) or a draw function.
      if (typeof win.showhowTimeline === 'function') {
        win.__tl = await win.showhowTimeline(ctx(win, sc));
        if (!win.__tl || typeof win.__tl.seek !== 'function') throw new Error('scene ' + sc.src + ': showhowTimeline must return a GSAP timeline');
        win.__tl.pause();
      } else if (typeof win.showhowScene !== 'function' && win.__timelines && Object.keys(win.__timelines).length) {
        // A HyperFrames block: its own paused GSAP timeline, registered by composition id.
        win.__tl = Object.values(win.__timelines)[0];
        win.__tl.pause();
      }
      // Otherwise the page animates on its own (a React component, three.js, a canvas loop):
      // the virtual clock drives it.
      await win.document.fonts.ready;
      await Promise.all([...win.document.images].map((im) => im.decode().catch(() => {})));
    }
    const win = frame.contentWindow;
    win.showhow.words = sc.words || [];
    // Callbacks on: count-ups and type-ons draw in onUpdate. Seeking is still deterministic.
    win.__showhowClock?.set(sc.age);
    if (win.__tl) win.__tl.seek(sc.age, false);
    else if (typeof win.showhowScene === 'function') await win.showhowScene({ ...ctx(win, sc), t: sc.age });
    await win.document.fonts.ready;
  }

  function ctx(win, sc) {
    const k = win.showhow;
    return { t: 0, duration: sc.duration, data: sc.data, theme: k.theme, at: k.at, words: sc.words || [], gsap: win.gsap, kit: k };
  }

  // GSAP and its plugins, from node_modules, into the scene. The global
  // timeline is paused: only what a scene puts on its own timeline moves,
  // and only when the render seeks it.
  const GSAP = ['gsap', 'CustomEase', 'DrawSVGPlugin', 'MotionPathPlugin', 'MorphSVGPlugin', 'SplitText'];
  async function injectGsap(win) {
    if (win.gsap) return;
    for (const name of GSAP) {
      await new Promise((ok, fail) => {
        const el = win.document.createElement('script');
        el.src = `${window.GSAP_DIR}/${name}.min.js`;
        el.onload = ok;
        el.onerror = () => fail(new Error('could not load ' + name));
        win.document.head.appendChild(el);
      });
    }
    // motion.dev too: its springs, inertia and sequences, made seekable by kit.motion.
    await new Promise((ok, fail) => {
      const el = win.document.createElement('script');
      el.src = `${window.GSAP_DIR}/../../motion/dist/motion.js`;
      el.onload = ok;
      el.onerror = () => fail(new Error('could not load motion'));
      win.document.head.appendChild(el);
    });
    win.gsap.registerPlugin(win.CustomEase, win.DrawSVGPlugin, win.MotionPathPlugin, win.MorphSVGPlugin, win.SplitText);
    win.gsap.ticker.lagSmoothing(0);
    // Timelines are thenables; awaiting one (an async showhowTimeline) would wait for it to finish playing.
    delete win.gsap.core.Animation.prototype.then;
    win.gsap.globalTimeline.pause();
  }

  // The kit a scene gets as window.showhow.
  function kit(win, sc) {
    const css = getComputedStyle(document.documentElement);
    const theme = { ...window.APP_THEME, ...Object.fromEntries(['--bg', '--bg2', '--accent', '--text', '--on-accent', '--font', '--heading'].map((k) => [k.slice(2), css.getPropertyValue(k).trim()])), palette: window.PALETTE_EXTRA };
    for (const [k, v] of Object.entries(theme)) if (typeof v === 'string' && v) win.document.documentElement.style.setProperty('--' + k, v);
    theme.palette.forEach((c, i) => win.document.documentElement.style.setProperty(`--palette-${i + 1}`, c));
    // The brand's fonts (theme.fonts) inside the scene too: an iframe doesn't see the stage's @font-face.
    if (window.FONTS_CSS && !win.document.getElementById('showhow-fonts')) {
      const st = win.document.createElement('style');
      st.id = 'showhow-fonts';
      st.textContent = window.FONTS_CSS;
      win.document.head.appendChild(st);
    }
    // at('consultar'): when the narration first says it, so a beat lands on the word.
    const norm = (w) => w.toLowerCase().replace(/[^\p{L}\p{N}]+/gu, '');
    const k = { spring, clamp01, theme, words: sc.words || [], sounds: [] };
    k.at = (phrase, fallback = 0) => {
      const target = phrase.split(/\s+/).map(norm);
      const ws = k.words;
      for (let i = 0; i + target.length <= ws.length; i++) if (target.every((w, j) => norm(ws[i + j].word) === w)) return ws[i].start;
      return fallback;
    };
    // asset('shots/x.png'): a file the person gave, relative to the spec.
    k.asset = (p) => new URL(p, sc.base).href;
    // sfx(2.4, 'pop'): a sound at that scene time, mixed into the soundtrack.
    k.sfx = (t, name, volume) => { k.sounds.push({ t, name, volume }); };
    // lift('checklist'): a piece of the real app, captured during recording,
    // as a detached element with its styles and fonts inlined.
    k.lift = (name) => {
      const xhr = new XMLHttpRequest();
      // A name is a lift from this recording; a path ending in .html is a lift file next to the spec
      // (e.g. one taken at another viewport).
      xhr.open('GET', name.endsWith('.html') ? new URL(name, sc.base).href : `${window.LIFT_DIR}/${name}.html`, false);
      try {
        xhr.send();
      } catch {
        /* missing file: reported below */
      }
      if (xhr.status && xhr.status !== 200 || !xhr.responseText) throw new Error(`no lift named "${name}": add { lift: …, as: ${name} } to a step and record again`);
      const tpl = win.document.createElement('template');
      tpl.innerHTML = xhr.responseText;
      const root = tpl.content.querySelector('[data-lift]');
      for (const style of tpl.content.querySelectorAll('style')) win.document.head.appendChild(style);
      return root;
    };
    // await kit.ready() before measuring layout: fonts (a lift brings its own) and images loaded.
    k.ready = async () => {
      await win.document.fonts.ready;
      await Promise.all([...win.document.images].map((im) => im.decode().catch(() => {})));
    };
    // retint(el, [fromHue, toHue]): saturated colours in that hue range take the video's accent hue,
    // keeping their lightness: a lifted panel in the app's brand colour joins the video's palette.
    k.retint = (root, range = [0, 360], to = theme.accent) => {
      const hsl = (c) => {
        const m = c.match(/[\d.]+/g)?.map(Number);
        if (!m || m.length < 3) return null;
        const [r, g, b] = m.slice(0, 3).map((v) => v / 255);
        const max = Math.max(r, g, b), min = Math.min(r, g, b), l = (max + min) / 2, d = max - min;
        if (!d) return { h: 0, s: 0, l, a: m[3] ?? 1 };
        const s2 = d / (1 - Math.abs(2 * l - 1));
        const h = max === r ? 60 * (((g - b) / d) % 6) : max === g ? 60 * ((b - r) / d + 2) : 60 * ((r - g) / d + 4);
        return { h: (h + 360) % 360, s: s2, l, a: m[3] ?? 1 };
      };
      const target = hsl(getComputedStyle(Object.assign(document.createElement('i'), { style: `color:${to}` })).color) ||
        (() => { const el = document.body.appendChild(document.createElement('i')); el.style.color = to; const c = hsl(getComputedStyle(el).color); el.remove(); return c; })();
      const map = (c) => {
        const x = hsl(c);
        if (!x || x.s < 0.3 || x.h < range[0] || x.h > range[1]) return null;
        return `hsla(${target.h.toFixed(0)}, ${(Math.min(1, target.s) * 100).toFixed(0)}%, ${(x.l * 100).toFixed(0)}%, ${x.a})`;
      };
      for (const el of [root, ...root.querySelectorAll('*')]) {
        const cs = win.getComputedStyle(el);
        for (const prop of ['color', 'background-color', 'fill', 'stroke', 'border-top-color', 'border-bottom-color', 'border-left-color', 'border-right-color']) {
          const v = map(cs.getPropertyValue(prop));
          if (v) el.style.setProperty(prop, v);
        }
      }
    };
    // mouth(t): how open a speaking mouth is (0–1) at scene time t, from the narration's word timings:
    // shut between words, opening and closing about once per syllable within one. Deterministic.
    k.mouth = (t) => {
      const w = k.words.find((x) => t >= x.start && t < x.end);
      if (!w) return 0;
      const syl = Math.max(1, (w.word.match(/[aeiouyáéíóúü]+/gi) || []).length);
      const p = (t - w.start) / Math.max(0.05, w.end - w.start);
      return 0.25 + 0.75 * Math.abs(Math.sin(Math.PI * syl * p));
    };
    // talking(t): is the narration mid-sentence (a word now, or a pause shorter than 0.35 s)?
    k.talking = (t) => k.words.some((x) => t >= x.start - 0.05 && t < x.end + 0.35);
    // blink(t): eyes shut for ~0.12 s every 2.8–4.4 s, the same on every render.
    k.blink = (t, seed = 1) => {
      let at = 1.2 + (seed % 7) * 0.31;
      for (let i = 0; at <= t; i++) {
        if (t < at + 0.12) return true;
        at += 2.8 + 1.6 * Math.abs(Math.sin(i * 12.9898 + seed));
      }
      return false;
    };
    // lipsync(tl, set): calls set({ mouth, talking, blink }) on every frame of the timeline, so a
    // character speaks the narration's words. set picks a mouth shape, scales a path, swaps an image.
    k.lipsync = (tl, set, { from = 0, to } = {}) => {
      const end = to ?? (k.words.at(-1)?.end ?? 0) + 1;
      tl.to({}, { duration: Math.max(0.01, end - from), ease: 'none', onUpdate() { const t = from + this.time(); set({ t, mouth: k.mouth(t), talking: k.talking(t), blink: k.blink(t) }); } }, from);
      return tl;
    };
    // motion(tl, controls, at): a motion.dev animation (Motion.animate(el, …, { type: 'spring' }), a
    // sequence, anything with .time and .duration) paused and driven by the scene's timeline from `at`,
    // so Motion's physics render frame-exactly like GSAP.
    k.motion = (tl, controls, at = 0) => {
      controls.pause();
      controls.time = 0;
      tl.to({}, { duration: Math.max(0.01, controls.duration), ease: 'none', onUpdate() { controls.time = this.time(); } }, at);
      return controls;
    };
    // Shared helpers, all safe to put on a seeked timeline.
    k.count = (el, from, to, opts = {}) => {
      const o = { v: from };
      const fmt = opts.format || ((v) => Math.round(v).toLocaleString(opts.locale));
      el.textContent = fmt(from);
      return win.gsap.to(o, { v: to, duration: opts.duration ?? 1.2, ease: opts.ease ?? 'power2.out', onUpdate: () => { el.textContent = fmt(o.v); } });
    };
    k.typeOn = (el, text, opts = {}) => {
      const o = { n: 0 };
      el.textContent = '';
      const cps = opts.cps ?? 28;
      return win.gsap.to(o, { n: text.length, duration: text.length / cps, ease: 'none', onUpdate: () => { el.textContent = text.slice(0, Math.round(o.n)); } });
    };
    return k;
  }

  // The sounds a scene schedules (scene time), for the mix.
  window.sceneSounds = async (sc) => {
    $('scene').dataset.key = '';
    await drawScene({ ...sc, alpha: 0 });
    return $('scene').contentWindow.showhow.sounds;
  };

  // Draws one moment. Everything comes in `s`; nothing depends on the clock.
  window.draw = async (s) => {
    await Promise.all([load($('frame'), s.frame), load($('fade'), s.fadeFrom), loadBackdrop(s.card?.backdrop ?? s.scene?.backdrop)]);
    $('fade').style.opacity = s.fadeFrom ? String(s.fadeAlpha) : '0';

    // The page covers the window (a portrait window crops it; the camera chooses what it shows).
    const k = Math.max(WIN_W / W, WIN_H / H);
    const cam = s.camera;
    const tx = WIN_W / 2 - cam.cx * k * cam.scale;
    const ty = WIN_H / 2 - cam.cy * k * cam.scale;
    $('cam').style.transform = `translate(${tx}px, ${ty}px) scale(${k * cam.scale})`;
    // Overlays (ring, cursor) ride the live camera, above the dissolve.
    $('cam3').style.transform = $('cam').style.transform;
    // The outgoing frame of a dissolve keeps its own framing.
    const fc = s.fadeCamera || cam;
    $('cam2').style.transform = `translate(${WIN_W / 2 - fc.cx * k * fc.scale}px, ${WIN_H / 2 - fc.cy * k * fc.scale}px) scale(${k * fc.scale})`;

    const cur = $('cursor');
    cur.style.display = s.cursor ? 'block' : 'none';
    if (s.cursor) {
      const size = 1 / Math.sqrt(cam.scale);
      cur.style.left = (s.cursor.x - 3) + 'px';
      cur.style.top = (s.cursor.y - 2) + 'px';
      cur.style.transform = `scale(${size * (s.cursor.down ? 0.85 : 1)})`;
    }
    const rip = $('ripple');
    if (s.ripple) {
      rip.style.left = s.ripple.x + 'px'; rip.style.top = s.ripple.y + 'px';
      rip.style.opacity = String(1 - s.ripple.p);
      rip.style.transform = `scale(${0.4 + s.ripple.p * 1.1})`;
    } else rip.style.opacity = '0';

    const ring = $('ring'), label = $('ringlabel');
    if (s.ring) {
      const pad = 6;
      Object.assign(ring.style, { left: s.ring.x - pad + 'px', top: s.ring.y - pad + 'px', width: s.ring.w + 2 * pad + 'px', height: s.ring.h + 2 * pad + 'px', opacity: String(s.ring.alpha) });
      label.style.opacity = s.ring.label ? String(s.ring.alpha) : '0';
      if (s.ring.label) {
        label.textContent = s.ring.label;
        const above = s.ring.y > 60;
        label.style.left = s.ring.x - pad + 'px';
        label.style.top = (above ? s.ring.y - pad - 38 : s.ring.y + s.ring.h + pad + 10) + 'px';
      }
    } else { ring.style.opacity = '0'; label.style.opacity = '0'; }

    const chip = $('chip');
    chip.style.opacity = s.chip ? String(s.chip.alpha) : '0';
    if (s.chip) { chip.querySelector('b').textContent = s.chip.n; chip.querySelector('span').textContent = s.chip.title; }

    const cap = $('caption');
    cap.style.opacity = s.caption ? '1' : '0';
    if (s.caption) cap.textContent = s.caption;

    // A scene sits on the card's aurora: draw that bare, then the scene over it.
    drawCard(s.card || (s.scene && { style: 'scene', title: '', alpha: s.scene.alpha, age: s.scene.age, backdrop: s.scene.backdrop }), s.t ?? 0);
    await drawScene(s.scene);
  };
</script>
</body>
</html>
